name: Desktop Build

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate tag, manifests, and changelog
        id: release
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer tag: $TAG" >&2
            exit 1
          fi

          PACKAGE_VERSION=$(jq -r '.version' package.json)
          LOCK_VERSION=$(jq -r '.packages[""].version' package-lock.json)
          TAURI_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          CARGO_VERSION=$(awk '
            /^\[package\]$/ { in_package=1; next }
            in_package && /^version = / { gsub(/version = |"/, ""); print; exit }
          ' src-tauri/Cargo.toml)
          CARGO_LOCK_VERSION=$(awk '
            $0 == "name = \"agent-usage-desktop\"" { found=1; next }
            found && /^version = / { gsub(/version = |"/, ""); print; exit }
          ' src-tauri/Cargo.lock)

          for manifest_version in \
            "$PACKAGE_VERSION" \
            "$LOCK_VERSION" \
            "$TAURI_VERSION" \
            "$CARGO_VERSION" \
            "$CARGO_LOCK_VERSION"; do
            if [ "$manifest_version" != "$VERSION" ]; then
              echo "Version mismatch: tag=$VERSION manifest=$manifest_version" >&2
              exit 1
            fi
          done

          awk -v version="$VERSION" '
            index($0, "## [" version "] - ") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no release notes for $VERSION" >&2
            exit 1
          fi

          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            {
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${TAG}"
            } >> release-notes.md
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  verify-go-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify Go and frontend
        run: |
          go test ./...
          go vet ./...
          npm test
          npm run build

  verify-rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build verification sidecar
        shell: bash
        run: |
          set -euo pipefail
          TARGET=$(rustc -vV | sed -n 's/^host: //p')
          case "$TARGET" in
            aarch64-apple-darwin) GOARCH=arm64 ;;
            x86_64-apple-darwin) GOARCH=amd64 ;;
            *) echo "Unsupported macOS host target: $TARGET" >&2; exit 1 ;;
          esac
          CGO_ENABLED=0 GOOS=darwin GOARCH="$GOARCH" \
            go build -o "src-tauri/binaries/agent-usage-$TARGET" .

      - name: Verify Rust layer
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  build:
    needs: [validate-release, verify-go-frontend, verify-rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            go_os: darwin
            go_arch: arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            go_os: windows
            go_arch: amd64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build Go sidecar
        shell: bash
        env:
          GOOS: ${{ matrix.go_os }}
          GOARCH: ${{ matrix.go_arch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA} -X main.date=${BUILD_DATE}" \
            -o "src-tauri/binaries/agent-usage-${{ matrix.target }}${EXT}" .

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Tauri app
        id: tauri
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}

      - name: Stage release artifacts
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          echo "$ARTIFACT_PATHS" | jq -r '.[]' | tr -d '\r' | while IFS= read -r artifact; do
            artifact="${artifact//\\//}"
            if [ ! -f "$artifact" ]; then
              echo "Missing Tauri artifact: $artifact" >&2
              exit 1
            fi
            cp "$artifact" release-assets/
          done
          if ! find release-assets -type f -print -quit | grep -q .; then
            echo "Tauri produced no release artifacts" >&2
            exit 1
          fi

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    needs: [validate-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' ASSETS < <(find release-assets -type f -print0)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No packaged artifacts were downloaded" >&2
            exit 1
          fi

          RELEASE_FLAGS=(--verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes/release-notes.md)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          else
            RELEASE_FLAGS+=(--latest)
          fi

          gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" "${RELEASE_FLAGS[@]}"
